function conns(t,r){ r=((r%4)+4)%4; if(t==='s')return r%2?[1,3]:[0,2]; return [r,(r+1)%4]; }
function mid(s){return [[.5,0],[1,.5],[.5,1],[0,.5]][s];}
function seg(t,a,b,n){
  n=n||14; const p0=mid(a),p1=mid(b),pts=[];
  if(t==='s'){ for(let i=0;i<=n;i++){const k=i/n;pts.push([p0[0]+(p1[0]-p0[0])*k,p0[1]+(p1[1]-p0[1])*k]);} return pts; }
  const cx=(a===1||b===1)?1:0, cy=(a===2||b===2)?1:0;
  const a0=Math.atan2(p0[1]-cy,p0[0]-cx);
  let d=Math.atan2(p1[1]-cy,p1[0]-cx)-a0;
  while(d>Math.PI)d-=2*Math.PI; while(d<=-Math.PI)d+=2*Math.PI;
  for(let i=0;i<=n;i++){const an=a0+d*i/n;pts.push([cx+.5*Math.cos(an),cy+.5*Math.sin(an)]);}
  return pts;
}
// placed: map "x,y" -> {t,r}; returns {pts, ok}
function run(L,placed){
  const [sx,sy,so]=L.start; const pts=[]; const add=(x,y,arr)=>arr.forEach(p=>pts.push([x+p[0],y+p[1]]));
  add(sx,sy,[[.5,.5],mid(so)]);
  let x=sx+D[so][0], y=sy+D[so][1], entry=(so+2)%4, ok=false;
  for(let i=0;i<200;i++){
    if(x<0||y<0||x>=L.cols||y>=L.rows)break;
    if(L.rocks.some(r=>r[0]===x&&r[1]===y))break;
    if(x===L.goal[0]&&y===L.goal[1]){ if(L.goal[2]===entry){add(x,y,[mid(entry),[.5,.5]]);ok=true;} break; }
    const c=placed[x+','+y]; if(!c)break;
    const cs=conns(c.t,c.r); if(!cs.includes(entry))break;
    const out=cs[0]===entry?cs[1]:cs[0];
    add(x,y,seg(c.t,entry,out)); entry=(out+2)%4; x+=D[out][0]; y+=D[out][1];
  }
  return {pts,ok};
}
